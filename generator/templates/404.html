{% extends "base.html" %}

{% block title %}404{% endblock %}
{% block og_title %}404 · {{ site.title }}{% endblock %}

{% block content %}
<div class="notfound">
  <img class="notfound-img" src="{{ root }}img/pixel-404.svg" alt="">
  <div class="notfound-art">404</div>
  <p class="notfound-text">这里什么都没有 —— 连小恐龙都跑掉了。</p>
  <p class="notfound-count" id="notfound-count">5 秒后自动返回首页…</p>
  <a class="pixel-btn" id="notfound-link" href="{{ root }}index.html">立即返回首页</a>
</div>
<script>
/* 404 页面可能在任何路径下被访问（如 /blogtest/posts/x.html），
   所以回首页不能只用相对链接：优先用站点绝对地址，本地开发回退相对路径。 */
(function () {
  var bp = {{ site.base_path|tojson }};
  var url = {{ site.site_url|tojson }};
  var home = "index.html";
  try {
    if (url && location.origin === new URL(url, location.href).origin) {
      home = new URL(url, location.href).pathname.replace(/\/+$/, "") + "/index.html";
    } else if (bp && location.pathname.indexOf(bp) === 0) {
      home = bp + "/index.html";
    }
  } catch (e) { /* keep relative fallback */ }
  document.getElementById("notfound-link").href = home;
  var left = 5;
  var el = document.getElementById("notfound-count");
  var timer = setInterval(function () {
    left--;
    if (left > 0) el.textContent = left + " 秒后自动返回首页…";
    else {
      clearInterval(timer);
      location.href = home;
    }
  }, 1000);
})();
</script>
{% endblock %}
