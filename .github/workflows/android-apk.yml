name: Build Android APK

on:
  push:
    paths:
      - 'mobile/**'
      - 'tools/write.html'
      - 'generator/static/css/fonts.css'
      - 'generator/static/fonts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PILOG_ANDROID_KEYSTORE: ${{ github.workspace }}/mobile/.signing/pilog.keystore
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          PILOG_ANDROID_KEYSTORE_BASE64: ${{ secrets.PILOG_ANDROID_KEYSTORE_BASE64 }}
        run: node mobile/scripts/restore-signing.mjs

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Build signed APK
        working-directory: mobile
        run: npm run apk

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk'

      - uses: actions/upload-artifact@v7
        with:
          name: pilog-write-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
