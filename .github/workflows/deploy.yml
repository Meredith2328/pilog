# 文章或站点源码更新后构建并发布；需要部署仓库 Contents: write 权限的 PILOG_TOKEN。

name: deploy

on:
  push:
    branches: [pilog]
    paths:
      - 'blogs/**'
      - 'generator/**'
      - 'dino/**'
      - 'tools/write.html'
      - 'build.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

concurrency:
  group: publish-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/pilog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py

      - name: Publish to deploy repo
        env:
          TOKEN: ${{ secrets.PILOG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 PILOG_TOKEN secret：请创建对部署仓库有 Contents: write 权限的 PAT，加到仓库 Actions secrets（名称 PILOG_TOKEN）"
            exit 1
          fi
          DEPLOY_REPO=$(python -c "import json;print(json.load(open('config.json'))['publish']['repo'])")
          DEPLOY_BRANCH=$(python -c "import json;print(json.load(open('config.json'))['publish']['branch'])")
          DEPLOY_DIR="$GITHUB_WORKSPACE/.deploy_test"
          git clone --depth 1 --branch "$DEPLOY_BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${DEPLOY_REPO}.git" "$DEPLOY_DIR"
          rsync -a --delete docs/ "$DEPLOY_DIR/docs/"
          cd "$DEPLOY_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "site: auto build ${GITHUB_SHA}"
          git push origin "$DEPLOY_BRANCH"
